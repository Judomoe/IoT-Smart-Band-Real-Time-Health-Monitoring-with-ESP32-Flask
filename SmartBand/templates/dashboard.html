<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="card-title mb-4">Welcome, ID: {{ signupId }}</h3>

            <!-- View Graphs button -->
            <p>
                <a href="{{ url_for('graphs', signupId=signupId) }}" class="btn btn-primary">
                    View Graphs
                </a>
            </p>

            <!-- 🔽 New: View Fitness Dashboard button -->
            <p>
                <a href="{{ url_for('fitness', signupId=signupId) }}" class="btn btn-success">
                    View Fitness Dashboard
                </a>

            </p>

            {% if data %}
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        {% for row in data %}
                            <tr>
                                {% for item in row %}
                                    <td>{{ item }}</td>
                                {% endfor %}
                            </tr>
                        {% endfor %}
                    </table>
                </div>
            {% else %}
                <p>No data available.</p>
            {% endif %}
        </div>
    </div>
</div>
</body>
</html>
